services:
  postgres:
    image: postgres:16.15-bookworm
    container_name: nisa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nisa
      POSTGRES_USER: nisa_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - /srv/nisa/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nisa_app -d nisa"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 128mb

  migrate:
    build:
      context: /srv/nisa/app
    image: nisa-api:0.7.1
    command: ["python", "migrate.py"]
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: nisa
      DB_USER: nisa_app
      DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: /srv/nisa/app
    image: nisa-api:0.7.1
    volumes:
      - nisa_verification_private:/data/private/verification
      - nisa_profile_photos:/data/profile-photos
    container_name: nisa-api
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      GOOGLE_OAUTH_CLIENT_ID: "420187056534-8egj374q1hvdtj5in956lo53o2s7evcr.apps.googleusercontent.com"
      DB_PORT: "5432"
      DB_NAME: nisa
      DB_USER: nisa_app
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USERNAME: admin.nisaesakina@gmail.com
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      REGISTRATION_DENYLIST_HMAC_KEY_FILE: /run/secrets/registration_denylist_hmac_key
      CORS_ALLOWED_ORIGINS: "https://nisaesakina.com,https://www.nisaesakina.com"
    secrets:
      - postgres_password
      - jwt_secret
      - smtp_password
      - registration_denylist_hmac_key
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    container_name: nisa-cloudflared
    user: "0:0"
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/tunnel_token
    secrets:
      - tunnel_token
    depends_on:
      api:
        condition: service_started

volumes:
  nisa_verification_private:
  nisa_profile_photos:

secrets:
  postgres_password:
    file: /srv/nisa/secrets/postgres_password

  jwt_secret:
    file: /srv/nisa/secrets/jwt_secret

  smtp_password:
    file: /srv/nisa/secrets/smtp_password

  registration_denylist_hmac_key:
    file: /srv/nisa/secrets/registration_denylist_hmac_key

  tunnel_token:
    file: /srv/nisa/secrets/cloudflare_tunnel_token
